<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="game-box">
            <div class="header">
                <h1>🎯 Number Guessing Game</h1>
                <p class="subtitle">I have selected a number between <strong>1</strong> and <strong>100</strong>.<br/>Try to guess it!</p>
            </div>

            <div class="game-body">
                <div class="input-group">
                    <input type="number" id="guessInput" placeholder="Enter your guess" min="1" max="100" autofocus />
                    <button id="guessBtn">Guess</button>
                </div>

                <div id="message" class="message"></div>

                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">Attempts</span>
                        <span id="attemptCount" class="stat-value">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Range</span>
                        <span id="rangeDisplay" class="stat-value">1 – 100</span>
                    </div>
                </div>

                <div id="history" class="history">
                    <h3>📋 Guess History</h3>
                    <ul id="historyList"></ul>
                </div>

                <button id="resetBtn" class="reset-btn">🔄 New Game</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
